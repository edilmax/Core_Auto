name: BookinVIP CI

# Gira ad ogni push/PR su master. In piu': la scansione OWASP ZAP del sito live gira
# SOLO su schedule settimanale o avvio manuale (non ad ogni commit).
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1'      # ogni lunedi' 03:00 UTC -> scansione ZAP del sito live
  workflow_dispatch: {}       # avvio manuale (utile per lanciare la ZAP a richiesta)

# ============================================================================
#  CONCORRENZA — non si bruciano minuti su codice gia' superato
# ============================================================================
# Se arriva un commit nuovo mentre la CI sta ancora girando sul precedente, la run
# vecchia viene ANNULLATA: l'unica che conta e' quella sull'ultimo codice, perche' e'
# quello che finisce in deploy.
# Il gruppo include l'EVENTO oltre al ramo: cosi' un push non annulla mai la scansione
# ZAP settimanale (schedule) ne' un avvio manuale (workflow_dispatch) — vivono in
# gruppi separati e possono convivere.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Token di CI a PRIVILEGI MINIMI: i job leggono il codice, non scrivono nulla.
permissions:
  contents: read

# ============================================================================
#  MAPPA DEI JOB — chi blocca e chi no (dichiarato, niente ambiguita')
# ============================================================================
#  BLOCCANTI (entrano nel job finale "gate"):
#    money-smoke · full-suite · full-suite-311 · copertura · mutazione · qualita ·
#    w3c · accessibilita · atheris · immagine
#  NON BLOCCANTI (fuori dal "gate", di proposito):
#    lint-severo  -> lint severo su codice gia' scritto: informativo, si legge il log
#    zap          -> gira solo a schedule/manuale, non ad ogni commit
#
#  ATTENZIONE, distinzione che va detta e non intuita: "bloccante" qui vuol dire
#  "il gate lo aspetta e il suo esito conta". Fra i bloccanti, w3c e' l'unico che
#  NON BLOCCA SUI RILIEVI (il suo comando finisce con `|| true`, vedi la sua
#  dichiarazione): resta nel gate perche' se il validatore stesso non gira il job
#  e' rosso e il gate lo vede, ma un errore HTML da solo non ferma la build.
#  Gli altri nove bloccano davvero sul contenuto.
#
#  >>> DA FARE A MANO DAL FONDATORE (io non ho accesso alle impostazioni di GitHub):
#      Settings -> Branches -> Branch protection rule su "master" ->
#      "Require status checks to pass before merging" -> aggiungere UN SOLO check:
#      il job chiamato **gate**. E' lui che riassume tutti gli altri: se anche un
#      solo job bloccante e' rosso, "gate" e' rosso. Non serve elencare gli altri.
# ============================================================================

# ============================================================================
#  PARITA' DI AMBIENTE — quale Python gira dove (DICHIARATO, non intuito)
# ============================================================================
#  Il modo di rompersi numero 8 di CLAUDE.md ("ambiente diverso: locale !=
#  produzione") qui era aperto e non dichiarato: la produzione gira dentro
#  l'immagine di Dockerfile.casavip, la CI girava tutta su un Python diverso.
#  Verde in CI non voleva dire verde in produzione, e nessuno se ne accorgeva.
#
#  L'unica verita' su cosa gira davvero e' la riga FROM del Dockerfile:
#      PRODUZIONE: python:3.11-slim
#
#  VERSIONI DI PYTHON AMMESSE IN QUESTA CI, ognuna con il suo motivo esplicito:
#      3.11 - MOTIVO: e' la versione della PRODUZIONE. Ci gira la suite (job
#             full-suite-311, con l'elenco del debito noto dichiarato dentro il
#             job) e il fuzzing dei motori-soldi (job atheris). Senza questa riga
#             nessun test vedrebbe mai il Python su cui il prodotto vive davvero.
#      3.9  - MOTIVO: e' il PAVIMENTO di compatibilita' e insieme il Python del
#             computer dove la suite si lancia a mano ogni giorno. Se il codice
#             smette di girarci, il lavoro locale si ferma e il fondatore non
#             puo' piu' collaudare nulla prima del deploy.
#
#  GUARDIA: test_parita_ambiente.py legge la riga FROM di Dockerfile.casavip e
#  legge questa dichiarazione, e va ROSSO se divergono, se un job usa una
#  versione non dichiarata qui, se una versione dichiarata non e' piu' usata da
#  nessuno, o se la versione di PRODUZIONE non e' quella di nessun job che gira
#  la suite intera. La dichiarazione non e' un commento gentile: e' un dato.
# ============================================================================

jobs:
  # Feedback VELOCE: i test critici sui soldi + Paga in Struttura (pochi minuti).
  money-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip                      # riusa i pacchetti gia' scaricati
      - name: Dipendenze di test
        run: pip install hypothesis
      - name: Test money-path + Paga in Struttura
        run: |
          python -m unittest \
            test_paga_struttura test_paga_struttura_p0 test_paga_struttura_e2e \
            test_paga_struttura_cablaggio test_paga_struttura_avanzato \
            test_fase85_pagamenti_stripe test_fase98_policy_commissione \
            test_conservazione_denaro test_cancellazione_money \
            test_fase189_price_alerts test_fase190_rate_parity \
            test_property_soldi

  # Suite INTERA (piu' lunga): il quadro completo. Installa le dipendenze di test che
  # alcuni test importano (flask/yaml/hypothesis) cosi' girano DAVVERO (non si saltano).
  # Gira sul PAVIMENTO (3.9). Il gemello sulla versione di PRODUZIONE e' il job
  # `full-suite-311` qui sotto: vedi la dichiarazione PARITA' DI AMBIENTE in testa.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      # `coverage` serve anche qui, non solo al job "copertura": test_pipeline_ci.py
      # riproduce dal vivo, in una cartella sterile, il comando di soglia usato dal
      # cricchetto e pretende di vederlo uscire diverso da zero sotto la soglia.
      - name: Dipendenze di test
        run: pip install -r requirements.txt hypothesis pyyaml coverage
      - name: Suite completa
        run: python -m unittest discover -s . -p "test_*.py"

  # ==========================================================================
  #  FULL-SUITE-311 — la stessa suite sul Python della PRODUZIONE (3.11)
  # ==========================================================================
  #  Buco chiuso il 2026-07-29 (modo di rompersi n. 8: "ambiente diverso").
  #  La produzione gira su python:3.11-slim; tutta la CI girava su 3.9. Nessun
  #  test aveva mai visto il Python su cui il prodotto vive davvero.
  #
  #  MISURA VERA presa prima di scrivere questo job (suite intera, 4582 test, su
  #  3.11): **22 rossi** che su 3.9 sono verdi. Non erano un'opinione: sono stati
  #  eseguiti. Due famiglie, ben distinte:
  #    (a) 15 rossi VERI di semantica, in 5 moduli - `datetime.fromisoformat` in
  #        3.11 accetta le forme ISO "di base" che 3.9 rifiutava ('20260905',
  #        '2026-W36-6'), quindi in PRODUZIONE certe date malformate passano e i
  #        test che le credono rifiutate cadono. E' un difetto vero del prodotto,
  #        non della CI, e va corretto alla fonte;
  #    (b) 7 errori che sono artefatti di Windows (shutil.rmtree su un file
  #        sqlite ancora aperto -> WinError 32) e su Linux non compaiono.
  #  Verificato anche che NON c'entra il pacchetto tzdata: su 3.9 CON tzdata
  #  installato quei 5 moduli restano verdi. La differenza e' proprio 3.11.
  #
  #  PERCHE' NON UNA MATRICE 3.9+3.11 SU full-suite: una gamba di matrice non puo'
  #  essere "meno bloccante" dell'altra senza `continue-on-error`, che qui e'
  #  vietato nei job bloccanti. Con la matrice il gate sarebbe ROSSO da subito per
  #  un debito noto: e un rosso permanente insegna a ignorare il rosso, che e' il
  #  danno peggiore. Quindi: job separato, che BLOCCA su tutto cio' che su 3.11 e'
  #  gia' verde, e tiene il debito noto in un elenco DICHIARATO e report-only.
  #
  #  >>> CRICCHETTO: da questo elenco si possono solo TOGLIERE moduli, mai
  #      aggiungerne. Quando un modulo viene corretto su 3.11 esce di qui e da
  #      quel momento e' protetto per sempre. Quando l'elenco arriva a ZERO,
  #      questo job diventa `unittest discover` puro come full-suite.
  full-suite-311:
    name: full-suite-311 (Python di PRODUZIONE, debito dichiarato)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Dipendenze di test
        run: pip install -r requirements.txt hypothesis pyyaml coverage
      # I 7 moduli con debito dichiarato (5 di semantica delle date + 2 che su
      # Windows sciolgono male le cartelle temporanee) restano fuori da QUESTO
      # comando, che blocca su tutto il resto: oggi sono 388 moduli su 395.
      - name: Suite su 3.11 meno il debito dichiarato (BLOCCA)
        run: |
          ls test_*.py \
            | grep -vE '^(test_fusi_orari|test_fuso_alloggio|test_fase64_smartpass|test_impossibile_tokyo_honolulu|test_paga_struttura_avanzato|test_fase10_dashboard|test_fase11_report)\.py$' \
            | sed 's/\.py$//' > moduli_311.txt
          echo "moduli in prova su 3.11: $(wc -l < moduli_311.txt) (esclusi 7 con debito dichiarato)"
          if [ "$(wc -l < moduli_311.txt)" -lt 300 ]; then
            echo "::error title=Elenco sospetto::meno di 300 moduli di test trovati: il filtro ha mangiato la suite."
            exit 1
          fi
          python -m unittest $(cat moduli_311.txt)
      # Il debito NON sparisce dalla vista: gira lo stesso, e il suo rosso resta
      # scritto nel log. E' l'unico modo perche' qualcuno lo chiuda.
      # Il messaggio finale NON e' fisso: dice la verita' misurata in questa run. Se un
      # giorno il debito passa, la CI lo annuncia e chiede di stringere il cricchetto -
      # cosi' non resta un elenco di esclusioni che nessuno rilegge piu'.
      - name: Il debito noto su 3.11 (report-only, deve restare visibile)
        if: always()
        run: |
          if python -m unittest test_fusi_orari test_fuso_alloggio test_fase64_smartpass \
               test_impossibile_tokyo_honolulu test_paga_struttura_avanzato \
               test_fase10_dashboard test_fase11_report; then
            echo "::notice title=Debito su Python 3.11 CHIUSO::i moduli esclusi passano ORA anche sul Python di produzione: toglili dal filtro del passo che blocca (cricchetto) e questo passo sparisce."
          else
            echo "::notice title=Debito su Python 3.11::i moduli dichiarati non passano ancora sul Python di PRODUZIONE (misura del 2026-07-29: 15 rossi veri di semantica delle date + artefatti Windows). Vedi il commento del job full-suite-311 in ci.yml."
          fi

  # ==========================================================================
  #  COPERTURA — quanta parte del prodotto vivo i test la attraversano davvero
  # ==========================================================================
  #  Misura RIGHE **e RAMI** (branch=True nel .coveragerc): non basta "questa riga
  #  e' stata eseguita", serve "anche il ramo else e' stato provato". La
  #  configurazione (cosa si misura e cosa no) sta in .coveragerc, scritta dal
  #  coordinatore: si misura SOLO il prodotto vivo (main_casavip.py + fase*.py in
  #  Docker), non i test, non gli strumenti d'officina, non il vecchio stack.
  #
  #  Perche' e' un job SEPARATO da full-suite e non un'aggiunta a quello:
  #    - full-suite resta il verdetto PULITO, senza strumentazione;
  #    - la strumentazione di coverage rallenta e puo' alterare i test sensibili al
  #      tempo: se qui va storto qualcosa, si vede subito che e' colpa della misura.
  #  I due job girano IN PARALLELO, quindi il tempo dell'orologio non raddoppia
  #  (raddoppiano solo i minuti fatturati). Se un giorno i minuti diventano un
  #  problema, il coordinatore puo' fondere i due job: basta far girare full-suite
  #  con "coverage run" e cancellare questo.
  copertura:
    name: copertura (righe + rami, soglia a cricchetto)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ------------------------------------------------------------------
      #  SOGLIA MINIMA DI COPERTURA — politica a CRICCHETTO: si puo' solo
      #  SALIRE, mai scendere. Una volta che il progetto ha raggiunto un
      #  livello, non gli e' piu' permesso tornare indietro.
      #
      #  ✅ MISURA VERA PRESA (run del 2026-07-28, commit e7beaea, suite INTERA su
      #  Linux): **82.5%** su 23.436 righe e 6.488 rami del prodotto vivo.
      #  Soglia portata da 55 (valore prudente non misurato) a **82**: il misurato
      #  arrotondato per difetto, con un solo punto di margine per il rumore.
      #
      #  >>> CRICCHETTO (regola permanente): questo numero si ALZA soltanto.
      #      Quando una run misura piu' dell'attuale, si alza al nuovo valore
      #      arrotondato per difetto. Non si abbassa MAI per far passare un commit:
      #      se la copertura scende, il commit ha tolto prove ed e' quello a dover
      #      cambiare, non la soglia.
      # ------------------------------------------------------------------
      COVERAGE_MIN: '82'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - name: Dipendenze di test + coverage
        run: pip install -r requirements.txt hypothesis pyyaml coverage
      - name: Suite completa SOTTO MISURA (righe + rami)
        run: coverage run -m unittest discover -s . -p "test_*.py"
      # Da qui in poi "if: always()": anche se la suite e' rossa, il report di
      # copertura si vuole comunque — serve a capire DOVE ci si e' fermati.
      - name: Report righe + rami (a schermo, con le righe scoperte)
        if: always()
        run: coverage report -m
      - name: Report HTML + XML
        if: always()
        run: |
          coverage html -d htmlcov
          coverage xml -o coverage.xml
      - name: Numero in chiaro nel riepilogo della run
        if: always()
        run: |
          TOT="$(coverage report | grep -E '^TOTAL' | tail -1 | awk '{print $NF}' || true)"
          if [ -z "$TOT" ]; then TOT="n/d"; fi
          echo "::notice title=Copertura misurata::COPERTURA TOTALE = ${TOT} (soglia minima COVERAGE_MIN = ${COVERAGE_MIN}%)"
          {
            echo "## Copertura del codice (righe + rami)"
            echo ""
            echo "- **COPERTURA TOTALE misurata: ${TOT}**"
            echo "- soglia minima richiesta (COVERAGE_MIN): **${COVERAGE_MIN}%**"
            echo ""
            echo "Politica a cricchetto: la soglia puo' solo salire, mai scendere."
            echo "Il dettaglio riga-per-riga e' nell'artifact \`copertura-html\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Carica il report HTML come artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: copertura-html
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
          if-no-files-found: warn
      # GATE VERO: sotto la soglia il job e' ROSSO. Ultimo passo, cosi' l'artifact
      # e il numero sono gia' stati pubblicati anche quando si fallisce.
      - name: CRICCHETTO - fallisce sotto la soglia minima
        run: coverage report --fail-under=${COVERAGE_MIN}

  # Guardia mutazione: prova che i test dei soldi non sono ciechi.
  mutazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nessuna "cache: pip" qui: questo job non installa niente (gira su stdlib pura),
      # quindi la cache sarebbe solo tempo perso a salvarla e ricaricarla.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Mutazione (i test si accorgono dei guasti?)
        run: python collaudi/mutazione_prodotto.py

  # ==========================================================================
  #  QUALITA' STATICA — qui ci sono i GATE VERI del lint (blocca sul certo)
  # ==========================================================================
  #  Filosofia: si blocca SOLO su cio' che e' difetto certo, mai sullo stile del
  #  codice gia' scritto (sarebbe un falso allarme quotidiano). Il lint severo
  #  vive nel job "lint-severo", che NON blocca ed e' dichiarato tale.
  qualita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install ruff mypy pip-audit bandit
      # --- GATE VERO 1 -------------------------------------------------------
      # Selezione STRETTA: solo regole da "bug certo" o "buco di sicurezza certo".
      # Oggi vale ZERO rilievi su tutto il prodotto -> se si accende, e' un difetto
      # nuovo introdotto adesso, non debito vecchio.
      #   E9  = errori di sintassi/IO      F63,F7,F82 = confronti e nomi rotti
      #   B002/B006/B012/B018 = trappole classiche (default mutabile, return in finally)
      #   S102 exec · S301 pickle · S302 marshal · S307 eval · S324 hash debole
      #   S506 yaml.load senza Loader · S602/S604/S605/S609 shell=True e affini
      #   S612 logging.config.listen · S701 jinja2 autoescape spento
      # VISTO ROSSO: su un file guasto apposta (exec, eval, pickle.loads, yaml.load,
      # md5, shell=True, default mutabile, nome non definito) questa lista li becca
      # tutti e 8 ed esce con codice 1. Non e' un ornamento.
      # CRICCHETTO: a questa lista si possono solo AGGIUNGERE regole, mai toglierne.
      - name: Ruff STRETTO (BLOCCA) - bug certi e costrutti pericolosi
        run: |
          ruff check fase*.py main_casavip.py --select "E9,F63,F7,F82,B002,B006,B012,B018,S102,S301,S302,S307,S324,S506,S602,S604,S605,S609,S612,S701"
      # --- report-only (il quadro completo resta nel log, non blocca) --------
      - name: Ruff quadro completo (report-only)
        run: ruff check fase*.py main_casavip.py --statistics || true
      - name: Mypy sui motori-soldi (report-only)
        run: mypy fase188_paga_struttura.py fase98_policy_commissione.py fase111_cancellazione.py --ignore-missing-imports || true
      - name: pip-audit (dipendenze)
        run: pip-audit || true
      # --- GATE VERO 2 -------------------------------------------------------
      # Bandit (security scanner). Un finding HIGH fa fallire la build.
      # Escluso ./collaudi (strumenti di test) e ./_archivio (storia). app.py e' Flask
      # legacy MORTO (produzione = fase83 stdlib) -> le sue voci non contano. Oggi: 0 HIGH.
      - name: Bandit (sicurezza - blocca sul grave)
        run: bandit -r . -x ./collaudi,./_archivio,./app.py --severity-level high --confidence-level high

  # ==========================================================================
  #  LINT SEVERO — INFORMATIVO, **NON BLOCCA** (dichiarazione esplicita)
  # ==========================================================================
  #  Perche' non blocca: la selezione severa (E,F,B,S = pycodestyle + pyflakes +
  #  bugbear + bandit-like) su un codice gia' scritto produce oggi ~105 rilievi sul
  #  prodotto vivo (erano 4808 prima degli ignore motivati in ruff.toml). Sono quasi
  #  tutti debito di stile e pulizia, non guasti: rendere la CI rossa per quelli
  #  significherebbe abituare tutti a ignorare il rosso — il peggior danno possibile.
  #  Quindi: si legge il log, si sistema un po' alla volta, e quando una famiglia di
  #  rilievi arriva a ZERO la si promuove nel GATE VERO del job "qualita".
  #  Questo job e' volutamente FUORI dal job finale "gate".
  #  Le regole, gli ignore e le loro motivazioni stanno in ruff.toml.
  lint-severo:
    name: lint-severo (informativo, NON blocca)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install ruff mypy
      - name: Ruff severo E,F,B,S su tutto il repo (conteggio per regola)
        run: ruff check . --statistics || true
      - name: Ruff severo sul prodotto vivo (elenco puntuale)
        run: ruff check fase*.py main_casavip.py --output-format=concise || true
      # Mypy con le viti strette SOLO sui moduli che muovono soldi: sono i tre punti
      # dove un tipo sbagliato diventa un euro sbagliato. Oggi: 4 rilievi aperti in
      # fase98_policy_commissione.py (confronti fra int e None) -> da guardare.
      - name: Mypy severo sui motori-soldi (report-only)
        run: |
          mypy fase188_paga_struttura.py fase98_policy_commissione.py fase111_cancellazione.py \
               fase101_stripe_connect.py fase177_financial_controller.py fase186_guardiano.py \
               --ignore-missing-imports --warn-redundant-casts --warn-unused-ignores \
               --no-implicit-optional --check-untyped-defs || true

  # ===== STRUMENTI ESTERNI: girano SOLO su Linux (Java/clang assenti su Windows) =====

  # W3C: validatore HTML5 ufficiale (Nu di W3C, via Java) su tutte le pagine servite.
  #
  # >>> DICHIARAZIONE: NON BLOCCA SUI RILIEVI <<<
  # Il comando finisce con `|| true`: i rilievi restano nel log e non fanno fallire il job.
  # NON e' una svista, ed e' gia' stato provato in entrambi i modi:
  #   - 2026-07-23 (secondo giro) il job fu reso HTML-STRICT dopo aver confermato 0 errori
  #     HTML veri (i due veri - `<img src="">` in index.html e un `<div>` dentro `<label>`
  #     in host.html - erano stati corretti alla fonte);
  #   - lo stesso giorno fu RIPORTATO a report-only: il Nu di W3C valida anche il CSS
  #     *inline* dentro le pagine e il suo motore CSS e' datato, quindi falsa-positiva su
  #     proprieta' valide e moderne (inset, text-wrap, background-clip, linear-gradient).
  #     Irrigidirlo significherebbe rosso quotidiano su CSS corretto: gridare al lupo, che
  #     e' il danno peggiore (si smette di guardare il rosso vero).
  # Per irrigidirlo davvero servono due cose, non una: filtrare i messaggi del motore CSS
  # (--ignore-re) e verificare il risultato su un giro vero. Finche' non e' fatto, questa
  # dichiarazione deve restare qui: test_pipeline_ci.py la confronta col comando e va ROSSO
  # se il commento dice una cosa e il codice ne fa un'altra.
  # I guardiani che bloccano davvero sul contenuto sono gli altri sette (soldi, suite,
  # copertura, mutazione, qualita, accessibilita, fuzzing).
  w3c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installa html5validator (usa il Nu di W3C)
        run: pip install html5validator
      # REPORT-ONLY (|| true): il Nu di W3C valida ANCHE il CSS inline nelle pagine e il suo
      # motore CSS e' datato (segnala a torto inset/text-wrap/background-clip/linear-gradient,
      # che sono CSS validi e moderni) -> non si puo' rendere strict senza falsi-rossi. I
      # rilievi HTML VERI (img src vuoto, div-in-label) sono gia' corretti; se rientrano si
      # vedono nel log. Guardiani strict veri: soldi/test/mutazione/atheris + zap-sul-grave.
      - name: Valida HTML5 + CSS delle pagine in deploy/ (report-only)
        run: html5validator --root deploy --also-check-css --show-warnings || true

  # ACCESSIBILITA: Playwright + Axe-Core (WCAG 2.1 A+AA) sulle pagine pubbliche statiche.
  # GATE VERO sul grave: una violazione 'critical'/'serious' fa fallire il job. Deterministico
  # (file://, niente server). Complementa collaudi/test_a11y.js (flusso dinamico, report-only) e
  # la guardia stdlib test_accessibilita.py. Trovati e chiusi il 2026-07-24: 2 contrasti + 2
  # critical sul pannello host (#lang senza nome, #p_files senza label).
  accessibilita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          # NIENTE `cache: npm`: la cache npm PRETENDE un lock file (package-lock.json /
          # npm-shrinkwrap.json / yarn.lock) che questo repo NON versiona -> il job moriva
          # con "Dependencies lock file is not found" PRIMA ancora di installare nulla.
          # Difetto della pipeline (2026-07-28), non del prodotto: visto solo dalla CI Linux.
      - name: Dipendenze (playwright + axe-core, gia' in package.json)
        run: npm install --no-audit --no-fund
      - name: Browser Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit WCAG statico (blocca su critical/serious)
        run: node collaudi/a11y_static.js

  # ATHERIS: fuzzing coverage-guided sui motori-soldi. Un invariante rotto = job ROSSO
  # (bug vero). Gli invarianti sono gia' provati a mano su 222.400 giri -> niente falsi-rossi.
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python 3.11: su 3.9 non c'e' la wheel di Atheris e la build da sorgente fallisce
      # (usa Py_IsNone, funzione della CPython >=3.10). I motori-soldi sono Python puro:
      # stesso identico comportamento. clang resta come rete di sicurezza per la build.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Dipendenze di build (fallback se manca la wheel)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Installa Atheris
        run: pip install atheris
      - name: Fuzz motori-soldi (max 2 min; crash o invariante rotto = STOP)
        run: python collaudi/fuzz_soldi.py -max_total_time=120 -atheris_runs=500000

  # ==========================================================================
  #  IMMAGINE — l'artefatto che va in produzione viene COSTRUITO e AVVIATO
  # ==========================================================================
  #  Buco chiuso il 2026-07-29. Nessun job costruiva l'immagine: la CI girava sui
  #  sorgenti sparsi sul runner, con i pacchetti di test installati attorno, e
  #  l'immagine Docker - l'UNICA cosa che gira davvero sul VPS - non veniva mai
  #  assemblata ne' avviata. Un commit che rompeva il Dockerfile (una COPY che non
  #  prende piu' i moduli, una ENV persa, il modulo d'avvio rinominato) passava il
  #  gate VERDE e si scopriva in produzione, a deploy fatto, col sito giu'.
  #
  #  Qui l'artefatto VERO viene: (1) costruito da Dockerfile.casavip; (2) AVVIATO
  #  con l'ambiente minimo che main_casavip.py pretende - senza HOST_KEY e
  #  ADMIN_KEY rifiuta di partire, ed e' giusto cosi' (fail-closed); (3) atteso
  #  finche' il suo HEALTHCHECK non dice 'healthy'; (4) INTERROGATO davvero
  #  dall'esterno: /api/health deve rispondere 200 col corpo del prodotto, e la
  #  pagina pubblica deve arrivare (prova che `COPY deploy ./deploy` ha funzionato:
  #  un'immagine che risponde alle API ma serve una pagina vuota e' rotta lo
  #  stesso). Poi il container si spegne sempre, anche se un passo fallisce.
  #
  #  Niente segreti qui dentro: le chiavi sono FINTE e servono solo a far partire
  #  il processo. Il container vive meno di un minuto, non e' raggiungibile da
  #  fuori e non tocca nessun servizio esterno: GEOCODING e POI_OSM spenti,
  #  MARCA_TEMPORALE spenta (niente chiamate alla TSA), nessuna chiave Stripe,
  #  nessun SMTP. Guardia statica sul contenuto di questo job:
  #  test_parita_ambiente.py.
  immagine:
    name: immagine (build Dockerfile.casavip + avvio reale + sonda)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Costruisci l'immagine di produzione
        run: docker build -f Dockerfile.casavip -t casavip-app:ci .
      - name: Avvia il container con l'ambiente minimo
        run: |
          docker run -d --name casavip_ci -p 18080:8080 \
            -e HOST=0.0.0.0 \
            -e PORTA=8080 \
            -e HOST_KEY=chiave-host-finta-solo-per-la-ci \
            -e ADMIN_KEY=chiave-admin-finta-solo-per-la-ci \
            -e CASAVIP_SEGRETO=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff \
            -e DATA_DIR=/data \
            -e GEOCODING=false \
            -e POI_OSM=false \
            -e MARCA_TEMPORALE=0 \
            casavip-app:ci
      - name: Aspetta la sonda di salute dell'immagine (HEALTHCHECK 'healthy')
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' casavip_ci)" != "true" ]; then
              echo "::error title=Il container si e' spento da solo::l'immagine parte e muore. I log del container sono nel passo qui sotto."
              exit 1
            fi
            STATO="$(docker inspect -f '{{.State.Health.Status}}' casavip_ci)"
            echo "tentativo $i/60: $STATO"
            if [ "$STATO" = "healthy" ]; then exit 0; fi
            if [ "$STATO" = "unhealthy" ]; then
              echo "::error title=Immagine malata::l'HEALTHCHECK dell'immagine dice 'unhealthy': il server non risponde sulla 8080 dentro il container."
              exit 1
            fi
            sleep 2
          done
          echo "::error title=Immagine mai pronta::in 120 secondi l'HEALTHCHECK non e' mai diventato 'healthy'."
          exit 1
      - name: Interroga la sonda dall'esterno (200 + corpo del prodotto)
        run: |
          CODICE="$(curl -s -o corpo.json -w '%{http_code}' http://127.0.0.1:18080/api/health)"
          echo "HTTP $CODICE"
          cat corpo.json
          echo
          if [ "$CODICE" != "200" ]; then
            echo "::error title=Sonda muta::/api/health ha risposto $CODICE invece di 200: l'immagine parte ma non serve niente."
            exit 1
          fi
          CORPO="$(tr -d '[:space:]' < corpo.json)"
          for ATTESO in '"status":"ok"' '"money_unit":"cents_integer"'; do
            case "$CORPO" in
              *"$ATTESO"*)
                echo "trovato nel corpo: $ATTESO" ;;
              *)
                echo "::error title=Corpo inatteso::/api/health ha risposto 200 ma nel corpo manca $ATTESO. Corpo ricevuto: $CORPO"
                exit 1 ;;
            esac
          done
      - name: La pagina pubblica arriva (prova che COPY deploy ha funzionato)
        run: |
          CODICE="$(curl -s -o pagina.html -w '%{http_code}' http://127.0.0.1:18080/)"
          echo "HTTP $CODICE"
          if [ "$CODICE" != "200" ]; then
            echo "::error title=Pagina assente::/ ha risposto $CODICE: l'immagine non contiene il frontend (STATIC_DIR=/app/deploy)."
            exit 1
          fi
          grep -q "<title>Bookin VIP</title>" pagina.html || {
            echo "::error title=Pagina sbagliata::/ risponde 200 ma non e' la home del prodotto."
            exit 1
          }
      - name: Il container NON gira da root (proprieta' dell'immagine, verificata viva)
        run: |
          UID_VERO="$(docker exec casavip_ci id -u)"
          echo "uid dentro il container: $UID_VERO"
          if [ "$UID_VERO" != "10001" ]; then
            echo "::error title=Container da root::l'immagine gira con uid $UID_VERO invece di 10001: la riga USER app del Dockerfile non e' arrivata all'artefatto."
            exit 1
          fi
      - name: Log del container (sempre, e' la diagnosi quando qualcosa e' rosso)
        if: always()
        run: docker logs casavip_ci || true
      - name: Spegni il container
        if: always()
        run: docker rm -f casavip_ci || true

  # OWASP ZAP: scansione DAST BASELINE (passiva, NON attacca) del sito live. Gira solo su
  # schedule settimanale o avvio manuale -> niente crawl della produzione ad ogni commit.
  # Report-only (|| true): i rilievi restano nel log del job.
  # FUORI dal "gate" di proposito: su push/PR questo job non gira proprio, e un job saltato
  # non puo' essere una condizione per far passare o bocciare un commit.
  zap:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      # STRICT sul GRAVE: -I fa si' che gli AVVISI non blocchino (al primo giro: 0 FAIL,
      # 59 PASS, 11 avvisi = header di hardening mancanti, non buchi). Esce non-zero SOLO
      # su un alert FAIL (vulnerabilita' vera). Niente mount: il report va su stdout.
      - name: OWASP ZAP Baseline sul sito live (STRICT - blocca solo su FAIL grave)
        run: |
          docker run --rm -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://bookinvip.com -I -a

  # ==========================================================================
  #  GATE — l'ESITO UNICO. E' questo il check da rendere "required" su GitHub.
  # ==========================================================================
  #  Dipende da TUTTI i job bloccanti. Se anche uno solo e' rosso (o annullato, o
  #  saltato quando non doveva), questo job e' ROSSO e il verdetto della CI e' ROSSO.
  #  Serve a due cose:
  #    1) dare al fondatore UN SOLO semaforo da guardare invece di otto;
  #    2) permettere di proteggere il ramo master con UN SOLO check richiesto, che
  #       non va piu' toccato quando in futuro si aggiungono o rinominano job.
  #
  #  >>> PASSAGGIO MANUALE PER IL FONDATORE (io non posso farlo: non ho accesso alle
  #      impostazioni del repository su GitHub):
  #      github.com/edilmax/Core_Auto -> Settings -> Branches -> Add branch
  #      protection rule -> Branch name pattern: master ->
  #      spuntare "Require status checks to pass before merging" ->
  #      cercare e selezionare il check chiamato **gate** -> Save.
  #
  #  "if: always()" e' obbligatorio: senza, questo job verrebbe saltato appena uno
  #  dei job da cui dipende fallisce, e non potrebbe dare il verdetto rosso.
  gate:
    name: gate (esito unico - da rendere required su GitHub)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - money-smoke
      - full-suite
      - full-suite-311
      - copertura
      - mutazione
      - qualita
      - w3c
      - accessibilita
      - atheris
      - immagine
    steps:
      # Nota: i nomi dei job con il trattino si leggono con le parentesi quadre
      # (needs['full-suite']) — e' la forma sicura documentata da GitHub.
      - name: Esiti dei job bloccanti
        run: |
          echo "money-smoke ....... ${{ needs['money-smoke'].result }}"
          echo "full-suite ........ ${{ needs['full-suite'].result }}"
          echo "full-suite-311 .... ${{ needs['full-suite-311'].result }}"
          echo "copertura ......... ${{ needs.copertura.result }}"
          echo "mutazione ......... ${{ needs.mutazione.result }}"
          echo "qualita ........... ${{ needs.qualita.result }}"
          echo "w3c ............... ${{ needs.w3c.result }}"
          echo "accessibilita ..... ${{ needs.accessibilita.result }}"
          echo "atheris ........... ${{ needs.atheris.result }}"
          echo "immagine .......... ${{ needs.immagine.result }}"
          {
            echo "## Esito della CI"
            echo ""
            echo "| job bloccante | esito |"
            echo "|---|---|"
            echo "| money-smoke | ${{ needs['money-smoke'].result }} |"
            echo "| full-suite | ${{ needs['full-suite'].result }} |"
            echo "| full-suite-311 | ${{ needs['full-suite-311'].result }} |"
            echo "| copertura | ${{ needs.copertura.result }} |"
            echo "| mutazione | ${{ needs.mutazione.result }} |"
            echo "| qualita | ${{ needs.qualita.result }} |"
            echo "| w3c | ${{ needs.w3c.result }} |"
            echo "| accessibilita | ${{ needs.accessibilita.result }} |"
            echo "| atheris | ${{ needs.atheris.result }} |"
            echo "| immagine | ${{ needs.immagine.result }} |"
            echo ""
            echo "I job \`lint-severo\` e \`zap\` sono informativi e non contano qui."
          } >> "$GITHUB_STEP_SUMMARY"
      # ----------------------------------------------------------------------
      #  LA QUARTA CONDIZIONE: IL DENOMINATORE. Aggiunta il 2026-08-06.
      # ----------------------------------------------------------------------
      #  Le prime tre righe cercano una parola BRUTTA fra gli esiti arrivati.
      #  Sono cieche per omissione: se un esito non arriva affatto, non c'e'
      #  nessuna parola brutta da trovare e il gate conclude VERDE.
      #
      #  Non e' teoria, e' successo: run 627 sul commit a67eef6, DUE VOLTE.
      #  Tentativo 1 - cinque job bloccanti morti in "Set up job" durante
      #  l'incidente "critical" di GitHub Actions aperto alle 15:22 ("Failed to
      #  resolve action download info", "Service Unavailable", "Bad Gateway").
      #  Tentativo 2 - tre job mai partiti ("The job was not acquired by Runner
      #  of type hosted even after multiple attempts"), esito `cancelled`, cioe'
      #  UNA DELLE TRE PAROLE che queste righe dichiarano di sorvegliare.
      #  In tutti e due i casi: passo SALTATO, gate `success`, master protetto
      #  da un semaforo verde che non aveva controllato niente.
      #
      #  ONESTA' SUI LIMITI (D18 punto 3): non sappiamo il MECCANISMO. Il log
      #  del gate richiede credenziali e le credenziali non si toccano, quindi
      #  non e' misurato se `needs.*.result` fosse incompleto o se
      #  l'orchestratore avesse sbagliato a compilarlo (nelle note della run
      #  compare anche un "Internal server error"). Questa riga non pretende di
      #  aver capito la causa: pretende la proprieta' che regge in ENTRAMBI i
      #  casi. Chiedere "sono arrivati TUTTI, e sono tutti success?" non e'
      #  cieco per omissione; chiedere "c'e' scritto failure?" si'.
      #
      #  Le prime tre righe NON sono ridondanti da togliere: NOMINANO i modi di
      #  fallire, e ognuna e' provata da sola in test_pipeline_ci.py. La quarta
      #  aggiunge il caso che non ha nome: nessun verdetto affatto.
      #
      #  >>> LA STRINGA E' SOTTO GUARDIA: test_pipeline_ci.py la RICALCOLA dal
      #      numero di job nei `needs` e va ROSSO se divergono. Aggiungere un job
      #      bloccante senza allungare questa riga fa fallire la suite lo stesso
      #      giorno - non fra sei mesi, quando il conto non torna piu' a nessuno.
      - name: VERDETTO ROSSO se un job bloccante non e' verde
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
          || join(needs.*.result, ' ') != 'success success success success success success success success success success' }}
        run: |
          echo "::error title=CI ROSSA::Almeno un job bloccante non e' verde, OPPURE non ha consegnato nessun esito. Guarda la tabella qui sopra: se un job ha esito diverso da 'success' e' quello da aprire; se una riga e' VUOTA quel job non e' mai partito (guasto di GitHub o runner mai assegnato) e il suo controllo NON e' stato fatto."
          exit 1
      - name: VERDETTO VERDE
        run: echo "Tutti i job bloccanti sono verdi. La CI e' VERDE."
