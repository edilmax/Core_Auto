name: BookinVIP CI

# Gira ad ogni push/PR su master. In piu': la scansione OWASP ZAP del sito live gira
# SOLO su schedule settimanale o avvio manuale (non ad ogni commit).
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1'      # ogni lunedi' 03:00 UTC -> scansione ZAP del sito live
  workflow_dispatch: {}       # avvio manuale (utile per lanciare la ZAP a richiesta)

# ============================================================================
#  CONCORRENZA — non si bruciano minuti su codice gia' superato
# ============================================================================
# Se arriva un commit nuovo mentre la CI sta ancora girando sul precedente, la run
# vecchia viene ANNULLATA: l'unica che conta e' quella sull'ultimo codice, perche' e'
# quello che finisce in deploy.
# Il gruppo include l'EVENTO oltre al ramo: cosi' un push non annulla mai la scansione
# ZAP settimanale (schedule) ne' un avvio manuale (workflow_dispatch) — vivono in
# gruppi separati e possono convivere.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Token di CI a PRIVILEGI MINIMI: i job leggono il codice, non scrivono nulla.
permissions:
  contents: read

# ============================================================================
#  MAPPA DEI JOB — chi blocca e chi no (dichiarato, niente ambiguita')
# ============================================================================
#  BLOCCANTI (entrano nel job finale "gate"):
#    money-smoke · full-suite · copertura · mutazione · qualita · w3c ·
#    accessibilita · atheris
#  NON BLOCCANTI (fuori dal "gate", di proposito):
#    lint-severo  -> lint severo su codice gia' scritto: informativo, si legge il log
#    zap          -> gira solo a schedule/manuale, non ad ogni commit
#
#  >>> DA FARE A MANO DAL FONDATORE (io non ho accesso alle impostazioni di GitHub):
#      Settings -> Branches -> Branch protection rule su "master" ->
#      "Require status checks to pass before merging" -> aggiungere UN SOLO check:
#      il job chiamato **gate**. E' lui che riassume tutti gli altri: se anche un
#      solo job bloccante e' rosso, "gate" e' rosso. Non serve elencare gli altri.
# ============================================================================

jobs:
  # Feedback VELOCE: i test critici sui soldi + Paga in Struttura (pochi minuti).
  money-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip                      # riusa i pacchetti gia' scaricati
      - name: Dipendenze di test
        run: pip install hypothesis
      - name: Test money-path + Paga in Struttura
        run: |
          python -m unittest \
            test_paga_struttura test_paga_struttura_p0 test_paga_struttura_e2e \
            test_paga_struttura_cablaggio test_paga_struttura_avanzato \
            test_fase85_pagamenti_stripe test_fase98_policy_commissione \
            test_conservazione_denaro test_cancellazione_money \
            test_fase189_price_alerts test_fase190_rate_parity \
            test_property_soldi

  # Suite INTERA (piu' lunga): il quadro completo. Installa le dipendenze di test che
  # alcuni test importano (flask/yaml/hypothesis) cosi' girano DAVVERO (non si saltano).
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - name: Dipendenze di test
        run: pip install -r requirements.txt hypothesis pyyaml
      - name: Suite completa
        run: python -m unittest discover -s . -p "test_*.py"

  # ==========================================================================
  #  COPERTURA — quanta parte del prodotto vivo i test la attraversano davvero
  # ==========================================================================
  #  Misura RIGHE **e RAMI** (branch=True nel .coveragerc): non basta "questa riga
  #  e' stata eseguita", serve "anche il ramo else e' stato provato". La
  #  configurazione (cosa si misura e cosa no) sta in .coveragerc, scritta dal
  #  coordinatore: si misura SOLO il prodotto vivo (main_casavip.py + fase*.py in
  #  Docker), non i test, non gli strumenti d'officina, non il vecchio stack.
  #
  #  Perche' e' un job SEPARATO da full-suite e non un'aggiunta a quello:
  #    - full-suite resta il verdetto PULITO, senza strumentazione;
  #    - la strumentazione di coverage rallenta e puo' alterare i test sensibili al
  #      tempo: se qui va storto qualcosa, si vede subito che e' colpa della misura.
  #  I due job girano IN PARALLELO, quindi il tempo dell'orologio non raddoppia
  #  (raddoppiano solo i minuti fatturati). Se un giorno i minuti diventano un
  #  problema, il coordinatore puo' fondere i due job: basta far girare full-suite
  #  con "coverage run" e cancellare questo.
  copertura:
    name: copertura (righe + rami, soglia a cricchetto)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ------------------------------------------------------------------
      #  SOGLIA MINIMA DI COPERTURA — politica a CRICCHETTO: si puo' solo
      #  SALIRE, mai scendere. Una volta che il progetto ha raggiunto un
      #  livello, non gli e' piu' permesso tornare indietro.
      #
      #  ATTENZIONE: 55 NON e' un numero misurato, e' un valore PRUDENTE messo
      #  a mano perche' la misura vera non e' mai stata presa su tutta la suite
      #  (l'unico dato locale disponibile era un file .coverage parziale, non
      #  rappresentativo). Il numero VERO lo stampa questo job al primo giro:
      #  lo trovi come annotazione "Copertura misurata" e nel riepilogo della run.
      #
      #  >>> COMPITO DEL COORDINATORE, dopo il PRIMO giro:
      #      - se il misurato e' SOPRA 55  -> alzare COVERAGE_MIN al misurato
      #        arrotondato per difetto (es. misurato 71.4 -> 71). Da li' in poi
      #        si alza e basta, ogni volta che si guadagna terreno.
      #      - se il misurato e' SOTTO 55  -> abbassare COVERAGE_MIN UNA VOLTA
      #        SOLA al misurato arrotondato per difetto, e da quel momento vale
      #        il cricchetto: solo in salita.
      # ------------------------------------------------------------------
      COVERAGE_MIN: '55'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - name: Dipendenze di test + coverage
        run: pip install -r requirements.txt hypothesis pyyaml coverage
      - name: Suite completa SOTTO MISURA (righe + rami)
        run: coverage run -m unittest discover -s . -p "test_*.py"
      # Da qui in poi "if: always()": anche se la suite e' rossa, il report di
      # copertura si vuole comunque — serve a capire DOVE ci si e' fermati.
      - name: Report righe + rami (a schermo, con le righe scoperte)
        if: always()
        run: coverage report -m
      - name: Report HTML + XML
        if: always()
        run: |
          coverage html -d htmlcov
          coverage xml -o coverage.xml
      - name: Numero in chiaro nel riepilogo della run
        if: always()
        run: |
          TOT="$(coverage report | grep -E '^TOTAL' | tail -1 | awk '{print $NF}' || true)"
          if [ -z "$TOT" ]; then TOT="n/d"; fi
          echo "::notice title=Copertura misurata::COPERTURA TOTALE = ${TOT} (soglia minima COVERAGE_MIN = ${COVERAGE_MIN}%)"
          {
            echo "## Copertura del codice (righe + rami)"
            echo ""
            echo "- **COPERTURA TOTALE misurata: ${TOT}**"
            echo "- soglia minima richiesta (COVERAGE_MIN): **${COVERAGE_MIN}%**"
            echo ""
            echo "Politica a cricchetto: la soglia puo' solo salire, mai scendere."
            echo "Il dettaglio riga-per-riga e' nell'artifact \`copertura-html\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Carica il report HTML come artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: copertura-html
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
          if-no-files-found: warn
      # GATE VERO: sotto la soglia il job e' ROSSO. Ultimo passo, cosi' l'artifact
      # e il numero sono gia' stati pubblicati anche quando si fallisce.
      - name: CRICCHETTO - fallisce sotto la soglia minima
        run: coverage report --fail-under=${COVERAGE_MIN}

  # Guardia mutazione: prova che i test dei soldi non sono ciechi.
  mutazione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nessuna "cache: pip" qui: questo job non installa niente (gira su stdlib pura),
      # quindi la cache sarebbe solo tempo perso a salvarla e ricaricarla.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Mutazione (i test si accorgono dei guasti?)
        run: python collaudi/mutazione_prodotto.py

  # ==========================================================================
  #  QUALITA' STATICA — qui ci sono i GATE VERI del lint (blocca sul certo)
  # ==========================================================================
  #  Filosofia: si blocca SOLO su cio' che e' difetto certo, mai sullo stile del
  #  codice gia' scritto (sarebbe un falso allarme quotidiano). Il lint severo
  #  vive nel job "lint-severo", che NON blocca ed e' dichiarato tale.
  qualita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install ruff mypy pip-audit bandit
      # --- GATE VERO 1 -------------------------------------------------------
      # Selezione STRETTA: solo regole da "bug certo" o "buco di sicurezza certo".
      # Oggi vale ZERO rilievi su tutto il prodotto -> se si accende, e' un difetto
      # nuovo introdotto adesso, non debito vecchio.
      #   E9  = errori di sintassi/IO      F63,F7,F82 = confronti e nomi rotti
      #   B002/B006/B012/B018 = trappole classiche (default mutabile, return in finally)
      #   S102 exec · S301 pickle · S302 marshal · S307 eval · S324 hash debole
      #   S506 yaml.load senza Loader · S602/S604/S605/S609 shell=True e affini
      #   S612 logging.config.listen · S701 jinja2 autoescape spento
      # VISTO ROSSO: su un file guasto apposta (exec, eval, pickle.loads, yaml.load,
      # md5, shell=True, default mutabile, nome non definito) questa lista li becca
      # tutti e 8 ed esce con codice 1. Non e' un ornamento.
      # CRICCHETTO: a questa lista si possono solo AGGIUNGERE regole, mai toglierne.
      - name: Ruff STRETTO (BLOCCA) - bug certi e costrutti pericolosi
        run: |
          ruff check fase*.py main_casavip.py --select "E9,F63,F7,F82,B002,B006,B012,B018,S102,S301,S302,S307,S324,S506,S602,S604,S605,S609,S612,S701"
      # --- report-only (il quadro completo resta nel log, non blocca) --------
      - name: Ruff quadro completo (report-only)
        run: ruff check fase*.py main_casavip.py --statistics || true
      - name: Mypy sui motori-soldi (report-only)
        run: mypy fase188_paga_struttura.py fase98_policy_commissione.py fase111_cancellazione.py --ignore-missing-imports || true
      - name: pip-audit (dipendenze)
        run: pip-audit || true
      # --- GATE VERO 2 -------------------------------------------------------
      # Bandit (security scanner). Un finding HIGH fa fallire la build.
      # Escluso ./collaudi (strumenti di test) e ./_archivio (storia). app.py e' Flask
      # legacy MORTO (produzione = fase83 stdlib) -> le sue voci non contano. Oggi: 0 HIGH.
      - name: Bandit (sicurezza - blocca sul grave)
        run: bandit -r . -x ./collaudi,./_archivio,./app.py --severity-level high --confidence-level high

  # ==========================================================================
  #  LINT SEVERO — INFORMATIVO, **NON BLOCCA** (dichiarazione esplicita)
  # ==========================================================================
  #  Perche' non blocca: la selezione severa (E,F,B,S = pycodestyle + pyflakes +
  #  bugbear + bandit-like) su un codice gia' scritto produce oggi ~105 rilievi sul
  #  prodotto vivo (erano 4808 prima degli ignore motivati in ruff.toml). Sono quasi
  #  tutti debito di stile e pulizia, non guasti: rendere la CI rossa per quelli
  #  significherebbe abituare tutti a ignorare il rosso — il peggior danno possibile.
  #  Quindi: si legge il log, si sistema un po' alla volta, e quando una famiglia di
  #  rilievi arriva a ZERO la si promuove nel GATE VERO del job "qualita".
  #  Questo job e' volutamente FUORI dal job finale "gate".
  #  Le regole, gli ignore e le loro motivazioni stanno in ruff.toml.
  lint-severo:
    name: lint-severo (informativo, NON blocca)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - run: pip install ruff mypy
      - name: Ruff severo E,F,B,S su tutto il repo (conteggio per regola)
        run: ruff check . --statistics || true
      - name: Ruff severo sul prodotto vivo (elenco puntuale)
        run: ruff check fase*.py main_casavip.py --output-format=concise || true
      # Mypy con le viti strette SOLO sui moduli che muovono soldi: sono i tre punti
      # dove un tipo sbagliato diventa un euro sbagliato. Oggi: 4 rilievi aperti in
      # fase98_policy_commissione.py (confronti fra int e None) -> da guardare.
      - name: Mypy severo sui motori-soldi (report-only)
        run: |
          mypy fase188_paga_struttura.py fase98_policy_commissione.py fase111_cancellazione.py \
               fase101_stripe_connect.py fase177_financial_controller.py fase186_guardiano.py \
               --ignore-missing-imports --warn-redundant-casts --warn-unused-ignores \
               --no-implicit-optional --check-untyped-defs || true

  # ===== STRUMENTI ESTERNI: girano SOLO su Linux (Java/clang assenti su Windows) =====

  # W3C: validatore HTML5 ufficiale (Nu di W3C, via Java) su tutte le pagine servite.
  # HTML in STRICT (blocca sugli errori HTML veri: al primo giro erano img src="" e <div>
  # dentro <label>, ora corretti -> 0 errori HTML). CSS in REPORT-ONLY: il motore CSS del
  # validatore e' datato e segnala a torto CSS validi e moderni (inset, text-wrap) -> non blocca.
  w3c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installa html5validator (usa il Nu di W3C)
        run: pip install html5validator
      # REPORT-ONLY (|| true): il Nu di W3C valida ANCHE il CSS inline nelle pagine e il suo
      # motore CSS e' datato (segnala a torto inset/text-wrap/background-clip/linear-gradient,
      # che sono CSS validi e moderni) -> non si puo' rendere strict senza falsi-rossi. I
      # rilievi HTML VERI (img src vuoto, div-in-label) sono gia' corretti; se rientrano si
      # vedono nel log. Guardiani strict veri: soldi/test/mutazione/atheris + zap-sul-grave.
      - name: Valida HTML5 + CSS delle pagine in deploy/ (report-only)
        run: html5validator --root deploy --also-check-css --show-warnings || true

  # ACCESSIBILITA: Playwright + Axe-Core (WCAG 2.1 A+AA) sulle pagine pubbliche statiche.
  # GATE VERO sul grave: una violazione 'critical'/'serious' fa fallire il job. Deterministico
  # (file://, niente server). Complementa collaudi/test_a11y.js (flusso dinamico, report-only) e
  # la guardia stdlib test_accessibilita.py. Trovati e chiusi il 2026-07-24: 2 contrasti + 2
  # critical sul pannello host (#lang senza nome, #p_files senza label).
  accessibilita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm                      # riusa i pacchetti npm gia' scaricati
      - name: Dipendenze (playwright + axe-core, gia' in package.json)
        run: npm install --no-audit --no-fund
      - name: Browser Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit WCAG statico (blocca su critical/serious)
        run: node collaudi/a11y_static.js

  # ATHERIS: fuzzing coverage-guided sui motori-soldi. Un invariante rotto = job ROSSO
  # (bug vero). Gli invarianti sono gia' provati a mano su 222.400 giri -> niente falsi-rossi.
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python 3.11: su 3.9 non c'e' la wheel di Atheris e la build da sorgente fallisce
      # (usa Py_IsNone, funzione della CPython >=3.10). I motori-soldi sono Python puro:
      # stesso identico comportamento. clang resta come rete di sicurezza per la build.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Dipendenze di build (fallback se manca la wheel)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Installa Atheris
        run: pip install atheris
      - name: Fuzz motori-soldi (max 2 min; crash o invariante rotto = STOP)
        run: python collaudi/fuzz_soldi.py -max_total_time=120 -atheris_runs=500000

  # OWASP ZAP: scansione DAST BASELINE (passiva, NON attacca) del sito live. Gira solo su
  # schedule settimanale o avvio manuale -> niente crawl della produzione ad ogni commit.
  # Report-only (|| true): i rilievi restano nel log del job.
  # FUORI dal "gate" di proposito: su push/PR questo job non gira proprio, e un job saltato
  # non puo' essere una condizione per far passare o bocciare un commit.
  zap:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      # STRICT sul GRAVE: -I fa si' che gli AVVISI non blocchino (al primo giro: 0 FAIL,
      # 59 PASS, 11 avvisi = header di hardening mancanti, non buchi). Esce non-zero SOLO
      # su un alert FAIL (vulnerabilita' vera). Niente mount: il report va su stdout.
      - name: OWASP ZAP Baseline sul sito live (STRICT - blocca solo su FAIL grave)
        run: |
          docker run --rm -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://bookinvip.com -I -a

  # ==========================================================================
  #  GATE — l'ESITO UNICO. E' questo il check da rendere "required" su GitHub.
  # ==========================================================================
  #  Dipende da TUTTI i job bloccanti. Se anche uno solo e' rosso (o annullato, o
  #  saltato quando non doveva), questo job e' ROSSO e il verdetto della CI e' ROSSO.
  #  Serve a due cose:
  #    1) dare al fondatore UN SOLO semaforo da guardare invece di otto;
  #    2) permettere di proteggere il ramo master con UN SOLO check richiesto, che
  #       non va piu' toccato quando in futuro si aggiungono o rinominano job.
  #
  #  >>> PASSAGGIO MANUALE PER IL FONDATORE (io non posso farlo: non ho accesso alle
  #      impostazioni del repository su GitHub):
  #      github.com/edilmax/Core_Auto -> Settings -> Branches -> Add branch
  #      protection rule -> Branch name pattern: master ->
  #      spuntare "Require status checks to pass before merging" ->
  #      cercare e selezionare il check chiamato **gate** -> Save.
  #
  #  "if: always()" e' obbligatorio: senza, questo job verrebbe saltato appena uno
  #  dei job da cui dipende fallisce, e non potrebbe dare il verdetto rosso.
  gate:
    name: gate (esito unico - da rendere required su GitHub)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - money-smoke
      - full-suite
      - copertura
      - mutazione
      - qualita
      - w3c
      - accessibilita
      - atheris
    steps:
      # Nota: i nomi dei job con il trattino si leggono con le parentesi quadre
      # (needs['full-suite']) — e' la forma sicura documentata da GitHub.
      - name: Esiti dei job bloccanti
        run: |
          echo "money-smoke ....... ${{ needs['money-smoke'].result }}"
          echo "full-suite ........ ${{ needs['full-suite'].result }}"
          echo "copertura ......... ${{ needs.copertura.result }}"
          echo "mutazione ......... ${{ needs.mutazione.result }}"
          echo "qualita ........... ${{ needs.qualita.result }}"
          echo "w3c ............... ${{ needs.w3c.result }}"
          echo "accessibilita ..... ${{ needs.accessibilita.result }}"
          echo "atheris ........... ${{ needs.atheris.result }}"
          {
            echo "## Esito della CI"
            echo ""
            echo "| job bloccante | esito |"
            echo "|---|---|"
            echo "| money-smoke | ${{ needs['money-smoke'].result }} |"
            echo "| full-suite | ${{ needs['full-suite'].result }} |"
            echo "| copertura | ${{ needs.copertura.result }} |"
            echo "| mutazione | ${{ needs.mutazione.result }} |"
            echo "| qualita | ${{ needs.qualita.result }} |"
            echo "| w3c | ${{ needs.w3c.result }} |"
            echo "| accessibilita | ${{ needs.accessibilita.result }} |"
            echo "| atheris | ${{ needs.atheris.result }} |"
            echo ""
            echo "I job \`lint-severo\` e \`zap\` sono informativi e non contano qui."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: VERDETTO ROSSO se un job bloccante non e' verde
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error title=CI ROSSA::Almeno un job bloccante non e' verde. Guarda la tabella qui sopra: il job con esito diverso da 'success' e' quello da aprire."
          exit 1
      - name: VERDETTO VERDE
        run: echo "Tutti i job bloccanti sono verdi. La CI e' VERDE."
